<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52677c"/></marker></defs><rect width="960" height="280" rx="16" fill="#ffffff"/><text x="32" y="40" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#172b45">GDB управляет выполнением через QEMU</text><rect x="38" y="95" width="330" height="100" rx="9" fill="#e7f1fc" stroke="#8ca3ba" stroke-width="1.5"/><text x="203.0" y="138.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#172b45" font-weight="bold">Терминал 2: GDB</text><text x="203.0" y="163.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#172b45">target remote localhost:1234</text><path d="M368 130 L590 130" stroke="#52677c" stroke-width="2.3" fill="none" marker-end="url(#arr)"/><path d="M590 167 L368 167" stroke="#52677c" stroke-width="2.3" fill="none" marker-end="url(#arr)"/><text x="480" y="116" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#172b45">step / continue</text><text x="480" y="192" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#172b45">регистры / PC</text><rect x="592" y="95" width="330" height="100" rx="9" fill="#e5f5ed" stroke="#8ca3ba" stroke-width="1.5"/><text x="757.0" y="138.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#172b45" font-weight="bold">Терминал 1: QEMU</text><text x="757.0" y="163.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#172b45">qemu-riscv64 -g 1234</text><text x="480" y="248" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#172b45">Оба процесса работают в одной Ubuntu ARM64.</text></svg>